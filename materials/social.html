<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisaGo — Social Media Cards</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,sans-serif;background:#f5f5f5;display:flex;flex-direction:column;align-items:center;padding:20px}
        .controls{margin-bottom:12px;text-align:center;font-size:14px;font-weight:600}
        .lang-bar{margin-bottom:20px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
        .lang-btn{padding:6px 14px;border-radius:6px;border:2px solid #ddd;background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s}
        .lang-btn.active{border-color:#FF6F00;background:#FFF3E0}.lang-btn:hover{border-color:#FF6F00}
        .cards{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
        .card-label{font-size:13px;color:#888;margin-bottom:8px;text-align:center}
        .social{width:540px;height:540px;background:#0c0c14;color:#f0f0f5;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px;position:relative;overflow:hidden}
        .social::before{content:"";position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:400px;height:400px;background:radial-gradient(circle,rgba(255,111,0,0.1) 0%,transparent 70%);pointer-events:none}
        .social *{position:relative}
        .logo{font-size:24px;font-weight:800;margin-bottom:28px}.logo span{color:#FF6F00}
        .headline{font-size:28px;font-weight:800;line-height:1.2;margin-bottom:10px;white-space:pre-line}.headline span{color:#FF6F00}
        .sub{font-size:15px;color:#b0b0c0;margin-bottom:28px}
        .qr{width:140px;height:140px;border-radius:12px;margin-bottom:12px}
        .url{font-size:12px;color:#707088}
        .story{width:360px;height:640px;background:#0c0c14;color:#f0f0f5;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 32px;position:relative;overflow:hidden}
        .story::before{content:"";position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:300px;height:300px;background:radial-gradient(circle,rgba(255,111,0,0.08) 0%,transparent 70%);pointer-events:none}
        .story *{position:relative}
        .story .logo{font-size:20px;margin-bottom:20px}
        .story .headline{font-size:24px;margin-bottom:8px}
        .story .sub{font-size:14px;margin-bottom:24px}
        .story .qr{width:120px;height:120px}
        .story .features{margin-top:20px;display:flex;flex-direction:column;gap:8px}
        .story .feat{font-size:13px;color:#b0b0c0}
    </style>
</head>
<body>
    <div class="controls no-print">Right-click any card → Save Image As (or screenshot)</div>
    <div class="lang-bar no-print">
        <button class="lang-btn active" data-lang="en" onclick="setLang('en',this)">🇺🇸 English</button>
        <button class="lang-btn" data-lang="es" onclick="setLang('es',this)">🇪🇸 Español</button>
        <button class="lang-btn" data-lang="pt" onclick="setLang('pt',this)">🇧🇷 Português</button>
        <button class="lang-btn" data-lang="fr" onclick="setLang('fr',this)">🇫🇷 Français</button>
        <button class="lang-btn" data-lang="zh" onclick="setLang('zh',this)">🇨🇳 中文</button>
        <button class="lang-btn" data-lang="ja" onclick="setLang('ja',this)">🇯🇵 日本語</button>
    </div>
    <div class="cards">
        <div>
            <p class="card-label">Instagram/Facebook Feed (1080x1080)</p>
            <div class="social">
                <div class="logo">Visa<span>Go</span></div>
                <div class="headline" id="t-feed-headline"></div>
                <div class="sub" id="t-feed-sub"></div>
                <img class="qr qr-img" src="" alt="QR">
                <div class="url" id="feedUrl"></div>
            </div>
        </div>
        <div>
            <p class="card-label">Instagram Story (1080x1920)</p>
            <div class="story">
                <div class="logo">Visa<span>Go</span></div>
                <div class="headline" id="t-story-headline"></div>
                <div class="sub" id="t-story-sub"></div>
                <img class="qr qr-img" src="" alt="QR">
                <div class="url" id="storyUrl"></div>
                <div class="features">
                    <div class="feat" id="t-story-f1"></div>
                    <div class="feat" id="t-story-f2"></div>
                    <div class="feat" id="t-story-f3"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="/translations.js"></script>
    <script>
        var params=new URLSearchParams(window.location.search);
        var partnerId=params.get("ref")||"partner";
        var url="https://visago.dev/r/"+partnerId;
        var qrSrc="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="+encodeURIComponent(url)+"&bgcolor=0c0c14&color=FF6F00";
        document.querySelectorAll(".qr-img").forEach(function(img){img.src=qrSrc});
        document.getElementById("feedUrl").textContent=url;
        document.getElementById("storyUrl").textContent=url;

        function setLang(lang,btn){
            var t=VISAGO_TRANSLATIONS[lang]||VISAGO_TRANSLATIONS.en;
            document.getElementById("t-feed-headline").textContent=t.mat_heading_next_country;
            document.getElementById("t-feed-sub").textContent=t.mat_scan;
            document.getElementById("t-story-headline").innerHTML=t.mat_need_visa+"<br><span>"+t.mat_check_before+"</span>";
            document.getElementById("t-story-sub").textContent=t.mat_scan;
            document.getElementById("t-story-f1").textContent="✈️ "+t.mat_countries_label;
            document.getElementById("t-story-f2").textContent="📡 "+t.mat_works_offline;
            document.getElementById("t-story-f3").textContent="🆓 "+t.mat_free_download;
            document.querySelectorAll(".lang-btn").forEach(function(b){b.classList.remove("active")});
            if(btn)btn.classList.add("active");
        }
        setLang(params.get("lang")||"en",document.querySelector('.lang-btn[data-lang="'+(params.get("lang")||"en")+'"]'));
    </script>
</body>
</html>
